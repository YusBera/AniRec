<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: library-led.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Encode+Sans+SC:wght@700&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#0b1812}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1536px">
  <div class="r-library-navigation region chrome" data-region="library-navigation"><!-- Indexed navigation, wordmark and sample label --></div>
  <div class="r-library-heading region text" data-region="library-heading"><!-- Page title and one descriptive sentence --><p style="font-size:var(--r-library-heading-font);font-family:var(--r-library-heading-family),sans-serif;font-weight:var(--r-library-heading-weight);line-height:1.05;margin:0">library-heading</p></div>
  <div class="r-profile-navigation region chrome" data-region="profile-navigation"><!-- Indexed navigation, wordmark and sample label --></div>
  <div class="r-profile-heading region text" data-region="profile-heading"><!-- Page title and one descriptive sentence --><p style="font-size:var(--r-profile-heading-font);line-height:1.05;margin:0">profile-heading</p></div>
  <div class="r-compare-navigation region chrome" data-region="compare-navigation"><!-- Indexed navigation, wordmark and sample label --></div>
  <div class="r-compare-heading region text" data-region="compare-heading"><!-- Page title and one descriptive sentence --><p style="font-size:var(--r-compare-heading-font);line-height:1.05;margin:0">compare-heading</p></div>
  <div class="r-settings-navigation region chrome" data-region="settings-navigation"><!-- Indexed navigation, wordmark and sample label --></div>
  <div class="r-settings-heading region text" data-region="settings-heading"><!-- Page title and one descriptive sentence --><p style="font-size:var(--r-settings-heading-font);line-height:1.05;margin:0">settings-heading</p></div>
  <div class="r-library-controls region control" data-region="library-controls"><!-- Collection selector, counts and view controls: rebuild the control's chrome from the crop (comp-spec.mjs --crop library-controls); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-library-card-0 region chrome" data-region="library-card-0"><!-- Square initials placeholder, title, genre labels, supplied score labels and saved action; user requires portrait correction and truthful values --></div>
  <div class="r-compare-card-0 region chrome" data-region="compare-card-0"><!-- Initials placeholder, title, genre labels and paired rating readouts; user requires portrait correction --></div>
  <div class="r-library-card-1 region chrome" data-region="library-card-1"><!-- Square initials placeholder, title, genre labels, supplied score labels and saved action; user requires portrait correction and truthful values --></div>
  <div class="r-compare-card-1 region chrome" data-region="compare-card-1"><!-- Initials placeholder, title, genre labels and paired rating readouts; user requires portrait correction --></div>
  <div class="r-library-card-2 region chrome" data-region="library-card-2"><!-- Square initials placeholder, title, genre labels, supplied score labels and saved action; user requires portrait correction and truthful values --></div>
  <div class="r-compare-card-2 region chrome" data-region="compare-card-2"><!-- Initials placeholder, title, genre labels and paired rating readouts; user requires portrait correction --></div>
  <div class="r-profile-identity region chrome" data-region="profile-identity"><!-- Identity initials, username and numeric account readings --></div>
  <div class="r-profile-readings region text" data-region="profile-readings"><!-- Three named readings with numeric values and explanations --><p style="font-size:var(--r-profile-readings-font);line-height:1.05;margin:0">profile-readings</p></div>
  <div class="r-profile-evidence-heading region text" data-region="profile-evidence-heading"><!-- Selected disagreement heading; strongest claim is not authoritative --><p style="font-size:var(--r-profile-evidence-heading-font);line-height:1.05;margin:0">profile-evidence-heading</p></div>
  <div class="r-profile-evidence-0 region chrome" data-region="profile-evidence-0"><!-- Initials placeholder, title and paired community and personal scores; user requires portrait correction --></div>
  <div class="r-profile-evidence-1 region chrome" data-region="profile-evidence-1"><!-- Initials placeholder, title and paired community and personal scores; user requires portrait correction --></div>
  <div class="r-compare-controls region control" data-region="compare-controls"><!-- Sample identity pair and comparison action: rebuild the control's chrome from the crop (comp-spec.mjs --crop compare-controls); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-compare-summary region text" data-region="compare-summary"><!-- Compatibility, shared anime and both-rated counts --><p style="font-size:var(--r-compare-summary-font);line-height:1.05;margin:0">compare-summary</p></div>
  <div class="r-compare-section region text" data-region="compare-section"><!-- Where you differ heading --><p style="font-size:var(--r-compare-section-font);line-height:1.05;margin:0">compare-section</p></div>
  <div class="r-settings-recommendation region control" data-region="settings-recommendation"><!-- Grouped recommendation labels and controls; implementation uses only verified capabilities: rebuild the control's chrome from the crop (comp-spec.mjs --crop settings-recommendation); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-settings-appearance region control" data-region="settings-appearance"><!-- Grouped appearance labels and controls; implementation uses only verified capabilities: rebuild the control's chrome from the crop (comp-spec.mjs --crop settings-appearance); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-settings-account region control" data-region="settings-account"><!-- Grouped account labels and controls; implementation uses only verified capabilities: rebuild the control's chrome from the crop (comp-spec.mjs --crop settings-account); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-settings-data region control" data-region="settings-data"><!-- Grouped data labels and controls; implementation uses only verified capabilities: rebuild the control's chrome from the crop (comp-spec.mjs --crop settings-data); its ink box, border, fill, radius, and label size are the comp's --></div>
</main>
</body>
</html>
