<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AniRec — Discover</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      The two faces the design tokens name first. They are bundled with the
      desktop package under gui/resources/fonts; a browser build fetches them
      instead. Both stacks in tokens.css fall back to faces that ship with
      Windows, so the page is correct before these load and on a machine that
      cannot reach them.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Martian+Mono:wght@400;600;700&display=swap"
    />
