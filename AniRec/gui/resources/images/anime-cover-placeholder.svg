<svg xmlns="http://www.w3.org/2000/svg" width="440" height="660" viewBox="0 0 440 660">
  <metadata>Original AniRec portrait cover placeholder, created for this GPL-3.0 project.</metadata>
  <!--
    A blank plate in the frame, not a skeleton loader.

    The previous version was a rounded card (rx="18") with round line caps,
    two blurred circles and two grey bars under a glyph - the loading-state
    idiom from modern web apps, drawn in hardcoded neutral-blue greys that
    belonged to no theme in this application. Nothing is loading here: this is
    a permanent statement that a title has no artwork, and it is the largest
    object on the primary surface whenever covers are missing.

    So: square corners, one hairline frame, and a dim wordmark on the well.
    Colours carry theme tokens rather than literals - Qt's SVG renderer has no
    CSS cascade, so resources.cover_placeholder_pixmap substitutes them into
    the source text before rendering, the same way the interface icons work.
  -->
  <rect width="440" height="660" fill="@ground@"/>
  <rect x="1.5" y="1.5" width="437" height="657" fill="none" stroke="@border@" stroke-width="3"/>
  <path d="M112 446l103-254c8-20 36-20 45 0l105 254h-65l-21-55h-91l-20 55h-56zm98-114h47l-24-68-23 68z" fill="@mark@"/>
</svg>
