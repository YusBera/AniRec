<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - {{ username }}</title>
</head>
<body>
    <h1>Welcome to the Dashboard, {{ username }}</h1>
    <ul>
        <li><a href="{{ url_for('generate_recommendations') }}">Generate Recommendations</a></li>
    </ul>

    <h2>Completed Animes</h2>
    <table>
        <thead>
            <tr>
                <th>Title</th>
                <th>Genres</th>
                <th>User Score</th>
            </tr>
        </thead>
        <tbody>
            {% for anime in completed_animes.values %}
            <tr>
                <td>{{ anime.Title }}</td>
                <td>{{ anime.Genres | join(', ') }}</td>
                <td>{{ anime['User Score'] }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
